name: pipeline

# A Go library: no image, no binaries. Every branch push runs lint, tests, the
# security scan and the committed-client checks, all through the Makefile in
# the repo's dev image. Default-branch runs then refresh the badges. A v* tag
# does not rerun the checks: it waits for that commit's default-branch run to
# succeed, cuts the GitHub release, refreshes the badges and publishes the agent
# skill to ClawHub. Branch pushes also dry-run the skill against ClawHub.
on:
  push:
  # Refreshes the imported-by badge. WEEKLY, not daily: pkg.go.dev's crawl lags
  # publication by days, so a daily run re-derives an unchanged number six extra
  # times a week, and each drags the full test suite along, since the badges
  # job needs the code job to pass.
  #
  # The WHOLE pipeline, not a badges-only job: the badge publisher wipes its
  # branch and republishes only what the run produced, so a badges-only refresh
  # would delete version/license.
  #
  # Slot derived from a hash of the repo name: GitHub cron has no randomness,
  # and the scheduler sheds queued runs hardest at the round numbers a human
  # would pick.
  schedule:
    - cron: "7 23 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  code:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write # for the sec SARIF upload
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test"
      sec_command: "make sec"
      # Skipped: `make generate` downloads Vectara's current spec, so the drift
      # check would fail on every upstream spec release instead of on a stale
      # committed client. Regenerate locally and commit the result.
      generate_command: "-"
      sarif_file: "sec.sarif"
      sarif_category: "go"
      sarif_required: true

  wait:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master

  release:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  # The tag run has no code job of its own, so it waits on the default-branch
  # run of the same commit instead.
  badges:
    needs: [code, wait]
    if: "always() && ((github.ref_name == github.event.repository.default_branch && needs.code.result == 'success') || (startsWith(github.ref, 'refs/tags/') && needs.wait.result == 'success'))"
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      importers: true

  # The reusable workflow dry-runs the agent skill under .agents/skills/ on
  # every call. This call is the branch check, gated on the code job so a broken
  # change never reaches the publish call below.
  clawhub-validate:
    needs: [code]
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["go-vectara"]'
      publish_plugins: false
      plugin_names: "[]"
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  # Publishes the agent skills under .agents/skills/ to ClawHub once the release
  # exists. The skill is validated again on the same run.
  clawhub:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["go-vectara"]'
      publish_plugins: false
      plugin_names: "[]"
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
