title = "go-vectara secret scanning"

[extend]
useDefault = true

# gitleaks' `dir` mode walks the working tree and does NOT honour .gitignore, so
# every gitignored local path is named again here. Nothing gitignored is tracked
# by git. The committed Go vendor/ tree is intentionally NOT listed: it ships to
# consumers, so it gets scanned. Verify with `git check-ignore <path>` before
# adding a line; an entry for a committed source path silences real leaks.
[[allowlists]]
description = "Gitignored local scratch, downloaded specs, caches, and scan artifacts"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.vscode(?:/|$)''',
  '''(^|/)\.telemetry(?:/|$)''',
  '''(^|/)\.research_files(?:/|$)''',
  '''(^|/)\.testing(?:/|$)''',
  '''(^|/)api/openapi(?:\.fixed)?\.yaml$''',
  '''(^|/)__pycache__(?:/|$)''',
  '''(^|/)sec\.sarif$''',
  '''(^|/)git-update\.sh(?:\.debot)?$''',
  '''(^|/)CLAUDE\.md$''',
]

# These exact public spec examples appear in generated comments. The cursor
# decodes to {"offset":1}; none of these examples grants access to an account.
[[allowlists]]
description = "Published curl authentication placeholders in generated comments"
condition = "AND"
paths = ['''(^|/)client_00[2-5]\.gen\.go$''']
regexes = ['''\bYOUR_API_KEY\b''', '''\bzwt_123456\b''']

[[allowlists]]
description = "Published pagination cursor in generated schema examples"
condition = "AND"
paths = ['''(^|/)client_001\.gen\.go$''']
regexes = ['''\beyJvZmZzZXQiOjF9\b''']
